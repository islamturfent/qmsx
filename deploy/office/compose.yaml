# Optional LOCAL development example. Nothing starts automatically.
services:
  collabora:
    image: ${CODE_IMAGE:-collabora/code:latest}
    ports:
      - "127.0.0.1:9980:9980"
    environment:
      aliasgroup1: ${QMS_WOPI_ORIGIN:-http://host.docker.internal:80}
      extra_params: >-
        --o:ssl.enable=false
        --o:ssl.termination=false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_add:
      - MKNOD
    restart: "no"
